<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voquill</title>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get("toast-overlay") === "1") {
          document.documentElement.dataset.overlay = "true";
        }
        if (params.get("agent-overlay") === "1") {
          document.documentElement.dataset.overlay = "true";
        }
        if (params.get("pill-overlay") === "1") {
          document.documentElement.dataset.overlay = "true";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
      }

      :root[data-overlay="true"],
      :root[data-overlay="true"] body {
        background-color: transparent;
      }

      .firebase-emulator-warning {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        var theme = localStorage.getItem('voquill-theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
